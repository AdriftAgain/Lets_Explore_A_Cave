<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    *{margin:0}

    @font-face {
        font-family: "handwriting";
        src: url("/fonts/BeautyDemo.ttf") format('truetype');
        font-style: normal;
        font-display: swap;
    }
        body {
            background-color: antiquewhite;
            width:100%;
            height:100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }


        .journal {
            background-image: url("images/paper.jpeg");
            border-style: solid;
            border-width: 20px 30px 20px 0px;
            border-color: rgb(80, 10, 10);
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            height: 80%;
            width: 80%;
            display: flex;
            transition: opacity 500ms;
            visibility: hidden;
            opacity: 0;
            position: fixed;
            /*z-index: 4;*/
        }

        .journal:target {
            visibility: visible;
            opacity: 1;
        }

  
        .closejournal {
            width: 100%;
            display: flex;
            justify-content: right;
            margin: 10px;
            text-decoration: none;
        }

        .closejournal:hover {
            color: pink;
        }

        .journaltext {
            height: 100%;
            width: 100%;
            padding: 5%;
            box-sizing: border-box;  
            font-family: "handwriting";
            font-size: 3em; 
            position: fixed;       
        }

         @media only screen and (min-width: 800px) {
            .journal {
                width: 600px;
            }
         }

         .box {
            width: 40%;
            margin: 0 auto;
            background: rgba(255,255,255,0.2);
            padding: 35px;
            border: 2px solid #fff;
            border-radius: 20px/50px;
            background-clip: padding-box;
            text-align: center;
            }

        .button {
            font-size: 1em;
            padding: 10px;
            color: #fff;
            border: 2px solid #06D85F;
            border-radius: 20px/50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease-out;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="journalpop" class="journal"> 
        <div class="journaltext"> miaou </div>
        <a class="closejournal" href="https://www.w3schools.com/css/css_positioning.asp"> &#10006 </a>
    </div>
    <div class="box">
	<a class="button" href="#journalpop">Let me Pop up</a>
    </div>
</body>
</html>
